remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "dirt"  # hoặc: air, aqua, contrast, dirt, mint, neon, plum, sunset
# air	Sáng, thoáng, nhiều khoảng trắng — hợp portfolio dev
# dark	Nền tối, chữ sáng — hợp blog technical
# mint	Sáng, điểm nhấn xanh mint, hiện đại
# contrast	Tương phản cao, rõ ràng, dễ đọc

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap

title: "Jekyll"
subtitle: "Made with theme 'Minimal Mistakes'"
url: "https://mmistakes.github.io/minimal-mistakes/"

search: true  # bật icon kính lúp trong masthead
breadcrumbs: false

author:
  name: "Thao Nguyen"
  bio: |
    AI-Augmented QA Engineer
    Self-taught Full-stack Dev
    Fintech & Crypto Enthusiast
  avatar: "/assets/images/avatar.png"
  home: "/about/"   # click vào avatar sẽ dẫn tới trang About
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://thaonbt.github.io/"

logo: /assets/images/favicon.ico

collections:
  projects:
    output: true
    permalink: /:collection/:path/

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true   # hiển thị thời gian đọc bài viết
      comments: false   # tắt chức năng bình luận
      share: true       # hiển thị nút chia sẻ bài viết
      related: true     # hiển thị bài viết liên quan

after_footer_scripts:
  - /assets/js/theme-toggle.js